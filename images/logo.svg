<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="50%" stop-color="#14284b" />
      <stop offset="100%" stop-color="#0a1526" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="35%" stop-color="#d49b29" />
      <stop offset="70%" stop-color="#f3c65c" />
      <stop offset="100%" stop-color="#9e6e12" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b29" />
      <stop offset="100%" stop-color="#fff1c4" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e84c3d" />
      <stop offset="100%" stop-color="#b8281b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circular Ring (Medallion Style) -->
  <circle cx="160" cy="160" r="152" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  <circle cx="160" cy="160" r="144" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />

  <!-- Heraldic Shield -->
  <path d="M 160 38 
           C 215 38 245 46 245 46 
           C 245 130 225 200 160 236 
           C 95 200 75 130 75 46 
           C 75 46 105 38 160 38 Z"
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" 
        filter="url(#shadow)" />

  <!-- Shield Inner Border -->
  <path d="M 160 46 
           C 208 46 235 53 235 53 
           C 235 125 218 190 160 224 
           C 102 190 85 125 85 53 
           C 85 53 112 46 160 46 Z"
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        opacity="0.85" />

  <!-- Decorative Laurel Wreath Left -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 68 115 C 60 125 58 140 64 150 C 66 142 70 134 76 128 Z" />
    <path d="M 65 145 C 58 158 59 174 68 185 C 69 175 73 166 80 160 Z" />
    <path d="M 72 180 C 68 195 73 212 85 222 C 84 212 87 202 95 195 Z" />
    <path d="M 88 215 C 88 228 97 242 112 250 C 108 240 110 230 118 224 Z" />
  </g>

  <!-- Decorative Laurel Wreath Right -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 252 115 C 260 125 262 140 256 150 C 254 142 250 134 244 128 Z" />
    <path d="M 255 145 C 262 158 261 174 252 185 C 251 175 247 166 240 160 Z" />
    <path d="M 248 180 C 252 195 247 212 235 222 C 236 212 233 202 225 195 Z" />
    <path d="M 232 215 C 232 228 223 242 208 250 C 212 240 210 230 202 224 Z" />
  </g>

  <!-- Central Star of Excellence -->
  <polygon points="160,54 163.5,63 173,63.5 165,69 168,78 160,72.5 152,78 155,69 147,63.5 156.5,63" fill="url(#goldGrad)" />

  <!-- Torch of Wisdom / Illumination -->
  <!-- Torch Flame -->
  <path d="M 160 76 
           C 167 85 174 94 170 106 
           C 167 115 160 120 160 120 
           C 160 120 153 115 150 106 
           C 146 94 153 85 160 76 Z" 
        fill="url(#crimsonGrad)" filter="url(#glow)" />
  <path d="M 160 84 
           C 164 90 167 96 165 104 
           C 163 109 160 114 160 114 
           C 160 114 157 109 155 104 
           C 153 96 156 90 160 84 Z" 
        fill="url(#goldLight)" />
  <!-- Torch Handle -->
  <path d="M 154 120 L 166 120 L 163 144 L 157 144 Z" fill="url(#goldGrad)" stroke="#684705" stroke-width="0.5" />
  <rect x="151" y="118" width="18" height="4" rx="2" fill="url(#goldGrad)" />

  <!-- Open Book of Knowledge -->
  <g transform="translate(0, 15)">
    <!-- Book Left Page -->
    <path d="M 160 148 C 145 139 125 139 110 144 C 108 145 107 147 107 150 L 107 186 C 122 181 142 181 160 190 Z" 
          fill="#fbfaf8" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Book Right Page -->
    <path d="M 160 148 C 175 139 195 139 210 144 C 212 145 213 147 213 150 L 213 186 C 198 181 178 181 160 190 Z" 
          fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Spine -->
    <line x1="160" y1="148" x2="160" y2="191" stroke="#b8831c" stroke-width="2" />
    <!-- Book Lines (Text Simulation) -->
    <line x1="117" y1="154" x2="152" y2="151" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="117" y1="162" x2="152" y2="159" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="117" y1="170" x2="148" y2="167" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="117" y1="178" x2="150" y2="175" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    
    <line x1="168" y1="151" x2="203" y2="154" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="168" y1="159" x2="203" y2="162" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="168" y1="167" x2="199" y2="170" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <line x1="168" y1="175" x2="201" y2="178" stroke="#3c4a63" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Banner Ribbon Bottom -->
  <g filter="url(#shadow)">
    <!-- Banner Ribbon Shadow/Back -->
    <path d="M 32 248 L 52 232 L 52 264 Z" fill="#885e10" />
    <path d="M 288 248 L 268 232 L 268 264 Z" fill="#885e10" />
    <!-- Banner Main Ribbon -->
    <path d="M 40 252 
             C 100 240 220 240 280 252 
             L 272 278 
             C 215 264 105 264 48 278 Z" 
          fill="url(#goldGrad)" stroke="#fff" stroke-width="0.8" />
    <!-- School Name Arched/Followed on Banner -->
    <text x="160" y="267" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
          font-size="12" 
          font-weight="900" 
          fill="#0a192f" 
          text-anchor="middle" 
          letter-spacing="1.5">
      GRACIOUS LOVE ACADEMY
    </text>
  </g>

  <!-- Motto Banner Underneath -->
  <g>
    <rect x="75" y="284" width="170" height="20" rx="10" fill="#0c1a30" stroke="url(#goldGrad)" stroke-width="1.2" />
    <text x="160" y="298" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
          font-size="8.5" 
          font-weight="700" 
          fill="url(#goldLight)" 
          text-anchor="middle" 
          letter-spacing="1">
      KNOWLEDGE FOR DIVERSITY • EST. 2023
    </text>
  </g>
</svg>
